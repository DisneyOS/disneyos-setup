<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DisneyOS Setup</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #123d73 0%, #071323 42%, #02060d 100%);
    }

    main {
      width: min(100%, 480px);
      padding: 40px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      background: rgba(7, 19, 35, 0.82);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #57d9ff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 10vw, 4rem);
      line-height: 1;
    }

    p {
      margin: 20px auto 0;
      max-width: 34ch;
      color: rgba(255, 255, 255, 0.76);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 10px 16px;
      border-radius: 999px;
      color: #bdf7ff;
      background: rgba(0, 174, 239, 0.14);
      border: 1px solid rgba(87, 217, 255, 0.25);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #57d9ff;
      box-shadow: 0 0 16px #57d9ff;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Installation Portal</p>
    <h1>DisneyOS</h1>

    <p>
      Your guided DisneyOS setup experience is being prepared.
    </p>

    <div class="status">Setup site online</div>
  </main>
</body>
</html>
