<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>DisneyOS Setup</title>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% -10%, rgba(35,136,255,.18), transparent 38%),
        #05070c;
      color: #f8fbff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 36px, 520px);
      padding: 36px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 28px;
      background: rgba(14,18,29,.76);
      box-shadow: 0 24px 90px rgba(0,0,0,.46);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .mark {
      width: 92px;
      height: 92px;
      margin: 0 auto 22px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 14px 34px rgba(35,136,255,.25));
    }
    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -.04em;
    }
    p {
      margin: 14px 0 0;
      color: rgba(235,244,255,.68);
      font-size: 16px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      min-height: 54px;
      margin-top: 26px;
      padding: 14px 20px;
      border: 0;
      border-radius: 17px;
      background: linear-gradient(135deg,#2388ff,#43e7ff);
      color: #00101b;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="assets/disneyos-mark.png" alt="DisneyOS">
    <h1>Opening DisneyOS Setup</h1>
    <p id="status">Loading the latest setup version…</p>
    <button id="retry" hidden>Try Again</button>
  </main>

  <script>
    const status = document.getElementById("status");
    const retry = document.getElementById("retry");

    async function openLatest() {
      retry.hidden = true;
      status.textContent = "Loading the latest setup version…";

      try {
        const response = await fetch("./latest.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to read latest.json");

        const data = await response.json();
        if (!data.current || !/^v[0-9]+$/.test(data.current)) {
          throw new Error("Invalid current version");
        }

        const destination = new URL(`./${data.current}/`, window.location.href);
        window.location.replace(destination.href);
      } catch (error) {
        status.textContent = "DisneyOS Setup could not be opened. Check your connection and try again.";
        retry.hidden = false;
      }
    }

    retry.addEventListener("click", openLatest);
    openLatest();
  </script>
</body>
</html>
